services:
  mysql:
    image: mysql:8.4
    container_name: yangyang-cms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  nocobase-mysql:
    image: mysql:8.4
    container_name: yangyang-nocobase-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOCOBASE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOCOBASE_DB_NAME}
      MYSQL_USER: ${NOCOBASE_DB_USER}
      MYSQL_PASSWORD: ${NOCOBASE_DB_PASSWORD}
    volumes:
      - nocobase_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  nocobase:
    image: nocobase/nocobase:2.2.40
    container_name: yangyang-nocobase
    restart: unless-stopped
    environment:
      APP_KEY: ${NOCOBASE_APP_KEY}
      DB_DIALECT: mysql
      DB_HOST: nocobase-mysql
      DB_PORT: 3306
      DB_DATABASE: ${NOCOBASE_DB_NAME}
      DB_USER: ${NOCOBASE_DB_USER}
      DB_PASSWORD: ${NOCOBASE_DB_PASSWORD}
    depends_on:
      nocobase-mysql:
        condition: service_healthy
    ports:
      - "13000:80"
    volumes:
      - nocobase_storage:/app/nocobase/storage

volumes:
  mysql_data:
  nocobase_mysql_data:
  nocobase_storage:
