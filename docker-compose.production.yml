services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_production_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - cms_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONTENT_SOURCE: ${CONTENT_SOURCE:-prisma}
      NOCOBASE_INTERNAL_URL: ${NOCOBASE_INTERNAL_URL:-http://nocobase:80}
      NOCOBASE_API_TOKEN: ${NOCOBASE_API_TOKEN:-}
      NOCOBASE_PUBLIC_ADMIN_URL: ${NOCOBASE_PUBLIC_ADMIN_URL:-https://cms.geyangyang.vip/admin}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cms_internal

  nocobase-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOCOBASE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOCOBASE_DB_NAME}
      MYSQL_USER: ${NOCOBASE_DB_USER}
      MYSQL_PASSWORD: ${NOCOBASE_DB_PASSWORD}
    volumes:
      - nocobase_mysql_production_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - cms_internal

  nocobase:
    image: nocobase/nocobase:2.2.40
    restart: unless-stopped
    environment:
      APP_KEY: ${NOCOBASE_APP_KEY}
      DB_DIALECT: mysql
      DB_HOST: nocobase-mysql
      DB_PORT: 3306
      DB_DATABASE: ${NOCOBASE_DB_NAME}
      DB_USER: ${NOCOBASE_DB_USER}
      DB_PASSWORD: ${NOCOBASE_DB_PASSWORD}
    depends_on:
      nocobase-mysql:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - nocobase_storage:/app/nocobase/storage
    networks:
      - cms_internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cms_internal

volumes:
  mysql_production_data:
  nocobase_mysql_production_data:
  nocobase_storage:

networks:
  cms_internal:
    driver: bridge

